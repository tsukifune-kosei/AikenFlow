name: Bug Report
description: Report a reproducible AikenFlow problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal protocol spec, command, or workspace steps.
      placeholder: |
        aikenflow check protocol.yaml --json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: AikenFlow CLI/extension version and Aiken CLI version if relevant.
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
  - type: dropdown
    id: boundary
    attributes:
      label: Boundary
      options:
        - Rust CLI / protocol semantics
        - Aiken generator
        - Lucid/off-chain generator
        - Assurance/audit output
        - VS Code extension
        - React webview
        - Documentation
