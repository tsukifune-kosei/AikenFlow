name: Feature Request
description: Suggest a scoped AikenFlow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or protocol risk should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should AikenFlow do?
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Product Boundary
      options:
        - Rust compiler core
        - Generator
        - Assurance
        - VS Code extension
        - Webview rendering
        - Agent support
        - Documentation
