name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AIKEN_VERSION: v1.1.19

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace --no-fail-fast -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit

  vscode-extension:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode-aikenflow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode-aikenflow/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
      - name: Build and unit test
        run: npm run check
      - name: Build backend CLI for extension smoke
        run: cargo build -p aikenflow-cli
        working-directory: .
      - name: Smoke backend export for extension fixture
        run: |
          ../../target/debug/aikenflow check fixtures/workspaces/simple-vault/protocol.yaml --json
          ../../target/debug/aikenflow export fixtures/workspaces/simple-vault/protocol.yaml --out /tmp/aikenflow-vscode-bundle.json
          node -e "const fs = require('fs'); const bundle = JSON.parse(fs.readFileSync('/tmp/aikenflow-vscode-bundle.json', 'utf8')); if (bundle.schemaVersion !== '0.1.0' || !bundle.graph?.transactions?.length) process.exit(1);"
      - name: Package VSIX
        run: npm run vsix
      - name: Verify VSIX archive
        run: |
          vsix_name="$(node -p "const p=require('./package.json'); p.name + '-' + p.version + '.vsix'")"
          unzip -t "$vsix_name"

  examples:
    name: Example Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Aiken
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/aiken-lang/aiken/releases/download/${AIKEN_VERSION}/aiken-installer.sh" | sh
          echo "$HOME/.aiken/bin" >> "$GITHUB_PATH"
          "$HOME/.aiken/bin/aiken" --version
      - name: Check generated examples with Aiken and TypeScript
        run: bash scripts/verify-examples.sh
