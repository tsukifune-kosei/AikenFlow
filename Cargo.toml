[workspace]
resolver = "2"
members = [
  "crates/aikenflow-ir",
  "crates/aikenflow-parser",
  "crates/aikenflow-aiken-gen",
  "crates/aikenflow-lucid-gen",
  "crates/aikenflow-assurance",
  "crates/aikenflow-export",
  "crates/aikenflow-agent-support",
  "crates/aikenflow-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tsukifune-kosei/AikenFlow"
homepage = "https://github.com/tsukifune-kosei/AikenFlow"
authors = ["AikenFlow contributors"]

[workspace.dependencies]
aikenflow-ir = { path = "crates/aikenflow-ir" }
aikenflow-parser = { path = "crates/aikenflow-parser" }
aikenflow-aiken-gen = { path = "crates/aikenflow-aiken-gen" }
aikenflow-lucid-gen = { path = "crates/aikenflow-lucid-gen" }
aikenflow-assurance = { path = "crates/aikenflow-assurance" }
aikenflow-export = { path = "crates/aikenflow-export" }
aikenflow-agent-support = { path = "crates/aikenflow-agent-support" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tempfile = "3.10"
